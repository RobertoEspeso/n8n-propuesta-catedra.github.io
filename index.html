    }

      outline-offset: 2px
    }

      width: 18px;
      height: 18px;

      stroke: currentColor;

      stroke-linecap: round;

      top: 0;

      white-space: nowrap

    }

      #progress {

      }

class=\"r\">\u003cspan class=\"n\">11\u003c/span>\u003cspan class=\"c\">Lógica\u003c/span>\u003cspan class=\"d\">IF, Switch, filtros y toma de decisiones.\u003c/span>\u003c/div>\n    \u003cdiv class=\"r\">\u003cspan class=\"n\">12\u003c/span>\u003cspan class=\"c\">Datos y loops\u003c/span>\u003cspan class=\"d\">Arrays, Loop Over Items, Merge y procesamiento de múltiples registros.\u003c/span>\u003c/div>\n    \u003cdiv class=\"r\">\u003cspan class=\"n\">13\u003c/span>\u003cspan class=\"c\">Webhooks y APIs\u003c/span>\u003cspan class=\"d\">GET/POST, JSON, endpoints, HTTP Request y Webhooks.\u003c/span>\u003c/div>\n    \u003cdiv class=\"r\">\u003cspan class=\"n\">14\u003c/span>\u003cspan class=\"c\">Casos empresariales\u003c/span>\u003cspan class=\"d\">Ventas, RRHH, soporte, administración y marketing.\u003c/span>\u003c/div>\n    \u003cdiv class=\"r\">\u003cspan class=\"n ia\">15\u003c/span>\u003cspan class=\"c\">IA + n8n\u003c/span>\u003cspan class=\"d\">Prompting, generación de workflows, JSON, importación y debugging.\u003c/span>\u003c/div>\n    \u003cdiv class=\"r\">\u003cspan class=\"n on\">16\u003c/span>\u003cspan class=\"c\" style=\"color:#C8EF52;\">Proyecto integrador\u003c/span>\u003cspan class=\"d\">Revisión, puesta a punto y presentación de automatizaciones.\u003c/span>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:975px;width:900px;z-index:10;\">\n    \u003cp style=\"font-size:18px;color:rgba(192,192,192,0.55);letter-spacing:0.04em;\">Propuesta académica · n8n Nivel Inicial · 32 horas\u003c/p>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n"}, {"id": "ejemplos-workflows", "title": "07 Ejemplos", "html": "\u003c!doctype html>\n\u003chtml lang=\"es-ES\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Pequeños ejemplos de lo que se construirá\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Akshar:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  *{box-sizing:border-box}\n  body{margin:0;padding:0;overflow:hidden;background:#1E1E1E}\n  .slide-container{font-family:'Akshar',sans-serif;color:#C0C0C0}\n  p,h1,h2,h3{margin:0}\n  h3{font-size:36px;font-weight:700;color:#EDEDED;}\n  .flow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:22px;font-size:24px;}\n  .lbl{font-weight:700;color:#C0C0C0;margin-right:6px;}\n  .chip{padding:5px 18px;border-radius:30px;background:rgba(6,3,71,0.6);border:1px solid #5E58E8;color:#EDEDED;font-weight:500;}\n  .chip.first{background:#C8EF52;border-color:#C8EF52;color:#1E1E1E;font-weight:700;animation:pulse 2.4s infinite;}\n  .ar{color:#C8EF52;font-weight:700;animation:nudge 1.6s ease-in-out infinite;display:inline-block;}\n  .desc{font-size:26px;line-height:1.4;color:#C0C0C0;margin-top:24px;}\n  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,239,82,.5)}50%{box-shadow:0 0 0 10px rgba(200,239,82,0)}}\n  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"slide-container\" data-screen-label=\"07 Ejemplos\" style=\"position:relative;width:1920px;height:1080px;overflow:hidden;background:#1E1E1E;\">\n\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:40px;top:40px;width:1840px;height:1000px;border:1px solid rgba(192,192,192,0.28);z-index:1;\">\u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:100px;width:1620px;z-index:10;\">\n    \u003ch2 style=\"font-size:76px;font-weight:500;line-height:1.05;color:#C8EF52;\">Pequeños ejemplos de lo que se construirá\u003c/h2>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:250px;width:795px;height:330px;padding:34px;border:1px solid rgba(192,192,192,0.16);background:rgba(255,255,255,0.02);border-radius:6px;z-index:10;\">\n    \u003ch3>Ejemplo 1 — Email comercial\u003c/h3>\n    \u003cdiv class=\"flow\">\u003cspan class=\"lbl\">Flujo:\u003c/span>\u003cspan class=\"chip first\">Gmail Trigger\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">IF\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">Responder / Etiquetar\u003c/span>\u003c/div>\n    \u003cp class=\"desc\">Cuando llega un correo, el flujo detecta si corresponde a una consulta comercial y toma una acción diferente según el resultado.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:975px;top:250px;width:795px;height:330px;padding:34px;border:1px solid rgba(192,192,192,0.16);background:rgba(255,255,255,0.02);border-radius:6px;z-index:10;\">\n    \u003ch3>Ejemplo 2 — Nuevo cliente\u003c/h3>\n    \u003cdiv class=\"flow\">\u003cspan class=\"lbl\">Flujo:\u003c/span>\u003cspan class=\"chip first\">Webhook\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">Notion\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">Slack\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">Email\u003c/span>\u003c/div>\n    \u003cp class=\"desc\">Un formulario envía los datos a n8n; el workflow guarda el cliente, avisa al equipo y envía una confirmación.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:610px;width:795px;height:330px;padding:34px;border:1px solid rgba(192,192,192,0.16);background:rgba(255,255,255,0.02);border-radius:6px;z-index:10;\">\n    \u003ch3>Ejemplo 3 — Documentos\u003c/h3>\n    \u003cdiv class=\"flow\">\u003cspan class=\"lbl\">Flujo:\u003c/span>\u003cspan class=\"chip first\">Google Drive Trigger\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">IF\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">Slack\u003c/span>\u003c/div>\n    \u003cp class=\"desc\">Cuando aparece un archivo en una carpeta, n8n identifica el tipo y notifica al equipo correspondiente.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:975px;top:610px;width:795px;height:330px;padding:34px;border:1px solid rgba(192,192,192,0.16);background:rgba(255,255,255,0.02);border-radius:6px;z-index:10;\">\n    \u003ch3>Ejemplo 4 — Automatización personal\u003c/h3>\n    \u003cdiv class=\"flow\">\u003cspan class=\"lbl\">Flujo:\u003c/span>\u003cspan class=\"chip first\">Schedule\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">procesamiento\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">Notion\u003c/span>\u003c/div>\n    \u003cp class=\"desc\">Una tarea programada puede recopilar, transformar y registrar información sin intervención manual.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:975px;width:900px;z-index:10;\">\n    \u003cp style=\"font-size:18px;color:rgba(192,192,192,0.55);letter-spacing:0.04em;\">Propuesta académica · n8n Nivel Inicial · 32 horas\u003c/p>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n"}, {"id": "trabajos-practicos", "title": "08 Trabajos prácticos", "html": "\u003c!doctype html>\n\u003chtml lang=\"es-ES\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Trabajos prácticos\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Akshar:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  *{box-sizing:border-box}\n  body{margin:0;padding:0;overflow:hidden;background:#1E1E1E}\n  .slide-container{font-family:'Akshar',sans-serif;color:#C0C0C0}\n  p,h1,h2{margin:0}\n  .row{display:flex;align-items:flex-start;padding:30px 0;border-bottom:1px solid rgba(192,192,192,0.14);}\n  .act{width:480px;flex:none;}\n  .act span{display:inline-block;font-size:28px;font-weight:700;padding:6px 20px;border-radius:30px;background:rgba(200,239,82,0.1);color:#C8EF52;}\n  .obj{flex:1;font-size:28px;line-height:1.4;color:#C0C0C0;padding-top:6px;}\n  .flow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;}\n  .chip{padding:4px 16px;border-radius:30px;background:rgba(6,3,71,0.6);border:1px solid #5E58E8;color:#EDEDED;font-size:26px;}\n  .ar{color:#C8EF52;font-weight:700;}\n  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(200,239,82,.45)}50%{box-shadow:0 0 0 10px rgba(200,239,82,0)}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"slide-container\" data-screen-label=\"08 Trabajos prácticos\" style=\"position:relative;width:1920px;height:1080px;overflow:hidden;background:#1E1E1E;\">\n\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:40px;top:40px;width:1840px;height:1000px;border:1px solid rgba(192,192,192,0.28);z-index:1;\">\u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:100px;width:1620px;z-index:10;\">\n    \u003ch2 style=\"font-size:84px;font-weight:500;line-height:1.05;color:#C8EF52;\">Trabajos prácticos\u003c/h2>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:240px;width:1620px;z-index:10;\">\n    \u003cp style=\"font-size:24px;font-weight:700;color:rgba(192,192,192,0.7);display:flex;border-bottom:1px solid rgba(192,192,192,0.3);padding-bottom:12px;\">\u003cspan style=\"width:480px;\">Actividad\u003c/span>\u003cspan>Objetivo\u003c/span>\u003c/p>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:290px;width:1620px;z-index:10;\">\n    \u003cdiv class=\"row\">\u003cdiv class=\"act\">\u003cspan>TP 1 — Automatización de emails\u003c/span>\u003c/div>\u003cdiv class=\"obj\">Crear un flujo con trigger, condición, expresión y envío de Gmail u Outlook.\u003c/div>\u003c/div>\n    \u003cdiv class=\"row\">\u003cdiv class=\"act\">\u003cspan>TP 2 — Recepción de consultas\u003c/span>\u003c/div>\u003cdiv class=\"obj\">\u003cdiv class=\"flow\">\u003cspan class=\"chip\">Webhook\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">validación\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">clasificación\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">Notion\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">Slack\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"chip\">Gmail/Outlook.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"row\">\u003cdiv class=\"act\">\u003cspan>TP 3 — Workflow asistido por IA\u003c/span>\u003c/div>\u003cdiv class=\"obj\">Diseñar un prompt, obtener un workflow/JSON con un LLM, importarlo, configurarlo, detectar errores y explicar las modificaciones.\u003c/div>\u003c/div>\n    \u003cdiv class=\"row\" style=\"border-bottom:none;\">\u003cdiv class=\"act\">\u003cspan style=\"background:#C8EF52;color:#1E1E1E;animation:glow 2.4s infinite;\">Trabajo integrador\u003c/span>\u003c/div>\u003cdiv class=\"obj\">Crear una automatización propia para un caso personal o empresarial utilizando lo visto en cursada. Se permite investigar e incorporar herramientas adicionales.\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:975px;width:900px;z-index:10;\">\n    \u003cp style=\"font-size:18px;color:rgba(192,192,192,0.55);letter-spacing:0.04em;\">Propuesta académica · n8n Nivel Inicial · 32 horas\u003c/p>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n"}, {"id": "ia-asistente", "title": "09 IA asistente", "html": "\u003c!doctype html>\n\u003chtml lang=\"es-ES\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>IA como asistente para construir workflows\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Akshar:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  *{box-sizing:border-box}\n  body{margin:0;padding:0;overflow:hidden;background:#1E1E1E}\n  .slide-container{font-family:'Akshar',sans-serif;color:#C0C0C0}\n  p,h1,h2,h3{margin:0}\n  h3{font-size:36px;font-weight:700;}\n  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}\n  .cur{display:inline-block;width:14px;height:28px;background:#C8EF52;vertical-align:-4px;margin-left:6px;animation:blink 1s steps(1) infinite;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"slide-container\" data-screen-label=\"09 IA asistente\" style=\"position:relative;width:1920px;height:1080px;overflow:hidden;background:#1E1E1E;\">\n\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:40px;top:40px;width:1840px;height:1000px;border:1px solid rgba(192,192,192,0.28);z-index:1;\">\u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:100px;width:1620px;z-index:10;\">\n    \u003ch2 style=\"font-size:72px;font-weight:500;line-height:1.05;color:#C8EF52;\">IA como asistente para construir workflows\u003c/h2>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:210px;width:1620px;z-index:10;\">\n    \u003cp style=\"font-size:28px;line-height:1.45;color:#C0C0C0;\">Una parte diferencial de la cátedra es enseñar a utilizar modelos de lenguaje como asistentes de automatización. El alumno aprende a describir el problema, solicitar la arquitectura del workflow, pedir un JSON importable y luego \u003cstrong style=\"color:#C8EF52;\">validar, entender, corregir y adaptar\u003c/strong> el resultado.\u003c/p>\n  \u003c/div>\n\n  \u003c!-- Prompt window -->\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:150px;top:410px;width:1010px;height:540px;border:1px solid rgba(94,88,232,0.6);background:rgba(6,3,71,0.27);border-radius:8px;z-index:1;\">\u003c/div>\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:151px;top:411px;width:1008px;height:58px;background:rgba(6,3,71,0.6);border-radius:8px 8px 0 0;z-index:2;\">\u003c/div>\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:180px;top:433px;width:60px;height:14px;z-index:3;background:radial-gradient(circle at 7px 7px,#C8EF52 6px,transparent 7px),radial-gradient(circle at 30px 7px,#5E58E8 6px,transparent 7px),radial-gradient(circle at 53px 7px,rgba(192,192,192,0.5) 6px,transparent 7px);\">\u003c/div>\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:270px;top:422px;width:500px;z-index:10;\">\n    \u003ch3 style=\"font-size:28px;color:#EDEDED;\">Ejemplo de prompt\u003c/h3>\n  \u003c/div>\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:190px;top:500px;width:930px;z-index:10;\">\n    \u003cp style=\"font-size:26px;font-weight:700;color:#C8EF52;\">Actúa como especialista en n8n.\u003c/p>\n    \u003cp style=\"font-size:25px;line-height:1.45;color:#C0C0C0;margin-top:20px;\">Quiero un workflow que, cuando llegue un email nuevo a Gmail, determine si es una consulta comercial. Si lo es, guardar los datos en Notion, avisar por Slack y responder al cliente. Explica primero la arquitectura y luego proporciona el workflow en JSON importable. Indica qué credenciales debo configurar y qué partes debo revisar antes de ejecutarlo. No inventes credenciales ni tokens.\u003cspan class=\"cur\">\u003c/span>\u003c/p>\n  \u003c/div>\n\n  \u003c!-- Principio pedagógico -->\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:1200px;top:410px;width:570px;height:540px;padding:40px;border:1px solid #C8EF52;background:rgba(200,239,82,0.1);border-radius:8px;z-index:10;\">\n    \u003ch3 style=\"color:#C8EF52;\">Principio pedagógico\u003c/h3>\n    \u003cp style=\"font-size:26px;line-height:1.45;color:#C0C0C0;margin-top:24px;\">\u003cstrong style=\"color:#EDEDED;font-size:30px;line-height:1.3;display:block;margin-bottom:14px;\">La IA no reemplaza la comprensión del alumno.\u003c/strong>El ejercicio busca que el estudiante pueda revisar un workflow generado, comprender qué hace cada nodo, verificar credenciales y datos, identificar errores y realizar modificaciones.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:980px;width:900px;z-index:10;\">\n    \u003cp style=\"font-size:18px;color:rgba(192,192,192,0.55);letter-spacing:0.04em;\">Propuesta académica · n8n Nivel Inicial · 32 horas\u003c/p>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n"}, {"id": "enfoque-practico", "title": "10 Enfoque práctico", "html": "\u003c!doctype html>\n\u003chtml lang=\"es-ES\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Enfoque práctico\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Akshar:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  *{box-sizing:border-box}\n  body{margin:0;padding:0;overflow:hidden;background:#1E1E1E}\n  .slide-container{font-family:'Akshar',sans-serif;color:#C0C0C0}\n  p,h1,h2{margin:0}\n  ul{list-style:none;margin:0;padding:0;}\n  li{position:relative;padding-left:40px;font-size:28px;line-height:1.4;color:#C0C0C0;margin-bottom:26px;}\n  li::before{content:'';position:absolute;left:0;top:12px;width:16px;height:16px;border-radius:50%;border:2px solid #C8EF52;background:rgba(200,239,82,0.25);}\n  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n  .g{transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"slide-container\" data-screen-label=\"10 Enfoque práctico\" style=\"position:relative;width:1920px;height:1080px;overflow:hidden;background:#1E1E1E;\">\n\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:40px;top:40px;width:1840px;height:1000px;border:1px solid rgba(192,192,192,0.28);z-index:1;\">\u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:100px;width:1620px;z-index:10;\">\n    \u003ch2 style=\"font-size:84px;font-weight:500;line-height:1.05;color:#C8EF52;\">Enfoque práctico\u003c/h2>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:225px;width:1620px;z-index:10;\">\n    \u003cp style=\"font-size:30px;line-height:1.45;color:#C0C0C0;\">La cursada prioriza el aprendizaje basado en problemas. En lugar de intentar memorizar una gran cantidad de nodos, se trabaja sobre situaciones reales y se aprende a investigar qué herramienta o nodo permite resolverlas.\u003c/p>\n  \u003c/div>\n\n  \u003c!-- Big stat -->\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:420px;width:720px;z-index:10;\">\n    \u003cp style=\"font-size:84px;font-weight:700;line-height:1;color:#5E58E8;\">30–40% \u003cspan style=\"font-size:48px;color:#EDEDED;\">teoría\u003c/span> \u003cspan style=\"font-size:40px;font-weight:400;color:#C0C0C0;\">y\u003c/span>\u003c/p>\n    \u003cp style=\"font-size:110px;font-weight:700;line-height:1.05;color:#C8EF52;margin-top:10px;\">60–70% \u003cspan style=\"font-size:56px;color:#EDEDED;\">práctica\u003c/span>\u003cspan style=\"font-size:56px;color:#EDEDED;\">.\u003c/span>\u003c/p>\n  \u003c/div>\n\n  \u003c!-- ratio bar -->\n  \u003cdiv data-object=\"true\" data-object-type=\"chart\" style=\"position:absolute;left:150px;top:720px;width:720px;height:60px;z-index:10;\">\n    \u003cdiv class=\"g\" style=\"position:absolute;left:0;top:0;width:720px;height:60px;border-radius:30px;overflow:hidden;background:linear-gradient(90deg,#5E58E8 0%,#5E58E8 30%,#C8EF52 40%,#C8EF52 100%);\">\u003c/div>\n  \u003c/div>\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:366px;top:796px;width:72px;height:4px;background:rgba(192,192,192,0.5);z-index:3;\">\u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:950px;top:410px;width:1px;height:500px;background:rgba(192,192,192,0.2);z-index:2;\">\u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:1010px;top:410px;width:760px;z-index:10;\">\n    \u003cul>\n      \u003cli>Cada clase termina con un desafío o actividad aplicable.\u003c/li>\n      \u003cli>Se utilizan servicios reales y ejemplos de empresa y vida cotidiana.\u003c/li>\n      \u003cli>Se enseña debugging desde el comienzo.\u003c/li>\n      \u003cli>Se incentiva la investigación autónoma y el uso responsable de documentación e IA.\u003c/li>\n      \u003cli>El proyecto final permite incorporar herramientas no vistas en clase si el alumno puede justificar su uso.\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:975px;width:900px;z-index:10;\">\n    \u003cp style=\"font-size:18px;color:rgba(192,192,192,0.55);letter-spacing:0.04em;\">Propuesta académica · n8n Nivel Inicial · 32 horas\u003c/p>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n"}, {"id": "resultado-esperado", "title": "11 Resultado esperado", "html": "\u003c!doctype html>\n\u003chtml lang=\"es-ES\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Resultado esperado\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Akshar:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  *{box-sizing:border-box}\n  body{margin:0;padding:0;overflow:hidden;background:#1E1E1E}\n  .slide-container{font-family:'Akshar',sans-serif;color:#C0C0C0}\n  p,h1,h2{margin:0}\n  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,239,82,.45)}50%{box-shadow:0 0 0 30px rgba(200,239,82,0)}}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  .pulse{animation:pulse 3s ease-in-out infinite}\n  .spin{animation:spin 50s linear infinite}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"slide-container\" data-screen-label=\"11 Resultado esperado\" style=\"position:relative;width:1920px;height:1080px;overflow:hidden;background:#1E1E1E;\">\n\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:40px;top:40px;width:1840px;height:1000px;border:1px solid rgba(192,192,192,0.28);z-index:1;\">\u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" class=\"spin\" style=\"position:absolute;left:1380px;top:-160px;width:700px;height:700px;border-radius:50%;border:2px dashed rgba(200,239,82,0.3);z-index:1;\">\u003c/div>\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" class=\"pulse\" style=\"position:absolute;left:1520px;top:-20px;width:420px;height:420px;border-radius:50%;background:rgba(200,239,82,0.1);border:10px solid #C8EF52;z-index:2;\">\u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:150px;width:1200px;z-index:10;\">\n    \u003ch2 style=\"font-size:96px;font-weight:700;line-height:1;letter-spacing:0.03em;color:#C0C0C0;text-transform:uppercase;\">Resultado esperado\u003c/h2>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"shape\" style=\"position:absolute;left:150px;top:300px;width:200px;height:4px;background:#C8EF52;z-index:3;\">\u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:430px;width:1560px;z-index:10;\">\n    \u003cp style=\"font-size:50px;line-height:1.4;color:#EDEDED;\">Al terminar la cátedra, el alumno debería poder pasar de una necesidad concreta —por ejemplo, \u003cem style=\"color:#C8EF52;\">“quiero que cuando llegue una consulta se registre, se avise al equipo y se responda automáticamente”\u003c/em>— a un \u003cstrong style=\"font-weight:700;background:rgba(94,88,232,0.35);padding:0 10px;border-radius:6px;\">workflow funcional, probado y documentado.\u003c/strong>\u003c/p>\n  \u003c/div>\n\n  \u003cdiv data-object=\"true\" data-object-type=\"textbox\" style=\"position:absolute;left:150px;top:900px;width:1200px;z-index:10;\">\n    \u003cspan style=\"display:inline-block;font-size:26px;font-weight:700;padding:8px 26px;border-radius:30px;background:#C8EF52;color:#1E1E1E;\">Propuesta académica · n8n Nivel Inicial · 32 horas\u003c/span>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n"}]</script>
  <script>
    (function () {
      var slides = JSON.parse(document.getElementById('slides-data').textContent);
      var stage = document.getElementById('stage');
      var count = document.getElementById('count');
      var label = document.getElementById('label');
      var progress = document.getElementById('progress');
      var cur = -1, hideTimer;

      function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'scale(' + s + ')';
        stage.style.marginLeft = stage.style.marginRight = ((1920 * s - 1920) / 2) + 'px';
        stage.style.marginTop = stage.style.marginBottom = ((1080 * s - 1080) / 2) + 'px';
      }

      // Se recrea el iframe en cada cambio para que las animaciones CSS de cada slide arranquen desde cero, igual que en el original.
      function go(i, fromHash) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        if (i === cur) return;
        cur = i;
        var f = document.createElement('iframe');
        f.setAttribute('sandbox', '');
        f.setAttribute('title', slides[i].title);
        f.srcdoc = slides[i].html;
        var oldFrame = stage.querySelector('iframe');
        if (oldFrame) oldFrame.remove();
        stage.insertBefore(f, stage.firstChild);
        count.textContent = (i + 1) + ' / ' + slides.length;
        label.textContent = slides[i].title;
        progress.style.width = ((i + 1) / slides.length * 100) + '%';
        if (!fromHash) history.replaceState(null, '', '#' + (i + 1));
      }

      function next() { go(cur + 1); }
      function prev() { go(cur - 1); }
      function toggleFs() {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      }

      document.getElementById('next').onclick = next;
      document.getElementById('prev').onclick = prev;
      document.getElementById('fs').onclick = toggleFs;

      document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        switch (e.key) {
          case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': case 'Enter': e.preventDefault(); next(); break;
          case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': e.preventDefault(); prev(); break;
          case 'Home': go(0); break;
          case 'End': go(slides.length - 1); break;
          case 'f': case 'F': toggleFs(); break;
        }
      });

      document.addEventListener('wheel', (function () {
        var lock = false;
        return function (e) {
          if (lock || Math.abs(e.deltaY) < 20) return;
          lock = true; setTimeout(function () { lock = false; }, 500);
          e.deltaY > 0 ? next() : prev();
        };
      })(), { passive: true });

      var tx = null;
      document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
      document.addEventListener('touchend', function (e) {
        if (tx === null) return;
        var dx = e.changedTouches[0].clientX - tx; tx = null;
        if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
      }, { passive: true });

      // Controles visibles solo al mover el mouse.
      function showUi() {
        document.body.classList.add('show-ui');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () { document.body.classList.remove('show-ui'); }, 2200);
      }
      document.addEventListener('mousemove', showUi);
      showUi();

      window.addEventListener('resize', fit);
      window.addEventListener('hashchange', function () { go((parseInt(location.hash.slice(1), 10) || 1) - 1, true); });

      fit();
      go((parseInt(location.hash.slice(1), 10) || 1) - 1, true);
    })();
  </script>
